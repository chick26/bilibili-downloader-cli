[package]
name = "bili-core"
version = "0.2.0"
description = "Reusable headless Bilibili download engine"
edition = "2024"
license = "MIT"

[features]
vendored-openssl = ["reqwest/native-tls-vendored"]

[dependencies]
dlopen2 = "0.8.2"
bilibili-video-downloader-plugin-api = { path = "../bili-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
specta = { version = "=2.0.0-rc.20", features = ["serde_json", "derive"] }
reqwest = { version = "0.12.22", default-features = false, features = ["default-tls", "system-proxy"] }
reqwest-retry = "0.7.0"
reqwest-middleware = "0.4.2"
eyre = "0.6.12"
parking_lot = { version = "0.12.4", features = ["send_guard"] }
tracing = "0.1.41"
tracing-error = "0.2.1"
tokio = { version = "1.46.0", features = ["full"] }
byteorder = "1.5.0"
strfmt = "0.2.4"
uuid = { version = "1.17.0", features = ["v4"] }
bytes = "1.10.1"
fs4 = "0.13.1"
num_enum = "0.7.4"
chrono = "0.4.41"
prost = "0.14.1"
yaserde = { version = "0.12.0", features = ["yaserde_derive"] }
float-ord = "0.3.2"
memchr = "2.7.5"
md-5 = "0.10.6"
rand = "0.9.1"
base64 = "0.22.1"

[dev-dependencies]
http = "1"
