name: Check for secrets

on:
  pull_request:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/bili-gitleaks"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$tool_dir/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
      - name: Scan history and working files
        shell: bash
        run: |
          "$RUNNER_TEMP/bili-gitleaks/gitleaks" git --redact=100 --no-banner --log-opts="--all" .
          "$RUNNER_TEMP/bili-gitleaks/gitleaks" dir --redact=100 --no-banner .
